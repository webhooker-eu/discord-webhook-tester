[project]
name = "discord-webhook-tester"
version = "0.1.0"
description = "CLI and web form that send a test message to a Discord webhook, with an embed builder"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["discord", "webhook", "embed", "cli", "testing"]
classifiers = [
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://webhooker.eu/"
Repository = "https://github.com/webhooker-eu/discord-webhook-tester"
Issues = "https://github.com/webhooker-eu/discord-webhook-tester/issues"

[project.scripts]
discord-webhook-tester = "discord_webhook_tester.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_webhook_tester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
